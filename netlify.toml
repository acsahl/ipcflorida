[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173

# Pretty API routes: /api/foo -> /.netlify/functions/foo
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# There is deliberately NO SPA catch-all (/* -> /index.html).
#
# The app has no client-side routing: page switching is React state and every
# URL it produces is "/". A catch-all buys nothing here and actively breaks
# `netlify dev`, which applies redirects ahead of the Vite proxy and would
# serve index.html for /src/*.jsx (blank page) and /api/* (dead functions).
# It breaks the same way from a _redirects file, since netlify dev also reads
# one from publicDir and from the publish dir. If real routes are added later,
# add the fallback then and verify `netlify dev` still serves /src/main.jsx as
# text/javascript.
