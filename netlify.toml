[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173

# Pretty API routes: /api/foo -> /.netlify/functions/foo
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# NOTE: the SPA fallback lives in public/_redirects, not here.
# `netlify dev` applies netlify.toml redirects *before* proxying to Vite, so a
# catch-all here rewrites /src/*.jsx to index.html and the page renders blank.
# public/_redirects is copied into dist/ at build time, so production still
# gets the fallback while local dev keeps working.
